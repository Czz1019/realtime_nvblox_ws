pose_source: cuvslam  # Use robot_eye_in_hand.yaml for the calibrated robot setup.

frames:
  global: odom
  rig: camera_left_optical_frame
  depth: camera_depth_optical_frame
  color: camera_color_optical_frame

realsense:
  serial: ''
  depth_width: 640
  depth_height: 480
  depth_fps: 60
  color_width: 640
  color_height: 480
  color_fps: 30
  preferred_gyro_fps: 200
  preferred_accel_fps: 200
  warmup_frames: 30
  emitter_flashing: true
  emitter_metadata_required: false
  parity_calibration_frames: 20
  sensor_queue_size: 2

vslam:
  enable: true
  enable_slam: true
  slam_sync_mode: false
  rectified_stereo: true
  async_sba: false
  pose_buffer_size: 512
  pose_wait_ms: 35.0
  max_pose_error_ms: 60.0
  imu_wait_ms: 5.0
  imu_queue_size: 2000
  vio_queue_size: 8
  use_full_imu_rotation: false
  gyro_noise_density: 0.0060673370376614875
  gyro_random_walk: 0.000036211951458325785
  accel_noise_density: 0.0336219792080528
  accel_random_walk: 0.0009825658997185147

mapping:
  voxel_size_m: 0.05
  max_integration_distance_m: 4.0
  depth_queue_size: 4
  color_queue_size: 2
  depth_hz: 30.0
  color_hz: 10.0
  esdf_update_hz: 30.0
  mesh_update_hz: 5.0
  mesh_output_hz: 1.0
  esdf_slice_output_hz: 5.0
  esdf_3d_output_hz: 30.0
  stats_hz: 1.0
  enable_color: false
  enable_mesh: false
  enable_esdf: true

esdf_slice:
  enabled: false
  resolution_m: 0.10
  size_x_m: 8.0
  size_y_m: 8.0
  z_mode: camera_relative
  z_m: 0.5
  z_offset_m: 0.0
  max_visualized_distance_m: 2.0

esdf_3d:
  enabled: true
  generate_hz: 30.0
  publish_hz: 30.0
  publish_full_grid: true
  resolution_m: 0.15
  size_x_m: 4.0
  size_y_m: 4.0
  size_z_m: 2.0
  offset_frame: world  # camera rotates x/y/z_offset with the optical frame
  center_on_camera: true
  center_x_m: 0.0
  center_y_m: 0.0
  center_z_m: 1.0
  z_offset_m: 0.0
  max_visualized_distance_m: 2.0

output:
  directory: ~/nvblox_output
  map_filename: realtime_map.nvblox
  mesh_filename: realtime_mesh.ply
  save_map_on_exit: false
  save_mesh_on_exit: false
  stats_json: runtime_stats.json
